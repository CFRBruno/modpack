<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forja de Modpack — planejador para Fabric</title>
<meta name="description" content="Planeje seu modpack de Minecraft (Fabric): defina o objetivo, pontue o pack e receba sugestões de mods.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%236e4520'/%3E%3Crect width='8' height='3' fill='%234f9d2d'/%3E%3Crect x='1' y='1' width='1' height='1' fill='%237bc94a'/%3E%3Crect x='5' width='2' height='1' fill='%237bc94a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f7; --panel:#ffffff; --panel2:#f1f4fa; --line:#d2d9e8; --bevel:#c3ccdf;
  --text:#1b2236; --muted:#586582; --lapis:#3556e0; --gold:#a96a0c; --copper:#0e7f6a;
  --red:#cc3333; --amethyst:#6a49d4; --xp:#3c9a0f; --xp2:#79cf36; --seg:#cdd5e7; --shadow:#0000002e;
  --head:'Pixelify Sans','Courier New',monospace;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121725; --panel:#1b2236; --panel2:#222b43; --line:#334060; --bevel:#10162a;
    --text:#e7ebf6; --muted:#9aa6c4; --lapis:#8197ff; --gold:#f0b94a; --copper:#4fd2b8;
    --red:#ff7070; --amethyst:#b6a0ff; --xp:#8cf03e; --xp2:#c4ff86; --seg:#2a3452; --shadow:#000000b0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121725; --panel:#1b2236; --panel2:#222b43; --line:#334060; --bevel:#10162a;
  --text:#e7ebf6; --muted:#9aa6c4; --lapis:#8197ff; --gold:#f0b94a; --copper:#4fd2b8;
  --red:#ff7070; --amethyst:#b6a0ff; --xp:#8cf03e; --xp2:#c4ff86; --seg:#2a3452; --shadow:#000000b0;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--body);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lapis);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.2}
h2{font-family:var(--head);font-size:1.55rem;letter-spacing:.01em}
h3{font-size:1.05rem}
p{margin:.4em 0}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:2px solid var(--line);box-shadow:0 3px 0 var(--shadow)}
.top .wrap{display:grid;grid-template-columns:minmax(180px,1fr) minmax(260px,1.2fr) auto;gap:18px;align-items:center;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none;image-rendering:pixelated}
.brand small{display:block;color:var(--muted);font-size:.78rem}
#packName{width:100%;min-width:0;background:transparent;border:0;border-bottom:2px dashed var(--line);font:700 1.15rem var(--head);padding:2px 0;color:var(--text)}
.xp{text-align:center}
.lvl{font:700 2rem/1 var(--head);color:var(--xp);text-shadow:2px 2px 0 var(--shadow);letter-spacing:.02em;min-height:2rem}
.lvl small{font:600 .85rem var(--body);color:var(--muted);text-shadow:none;margin-left:6px}
.xpbar{position:relative;height:14px;margin:6px auto 4px;background:var(--seg);border:2px solid var(--bevel);max-width:440px;overflow:hidden}
.xpbar .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--xp),var(--xp2));transition:width .35s ease}
.xpbar .segs{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 2px),var(--panel) calc(5% - 2px) 5%)}
.verdict{font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{border:1px solid var(--line);background:var(--panel2);padding:2px 9px;font-size:.8rem;border-radius:3px;white-space:nowrap}
.chip.warn{border-color:var(--gold);color:var(--gold)}
.chip.err{border-color:var(--red);color:var(--red)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-top:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;padding-top:0;padding-bottom:0;display:flex}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--lapis)}
.tab .n{font-size:.75rem;background:var(--lapis);color:#fff;border-radius:9px;padding:0 6px;margin-left:5px}
.theme{background:transparent;border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-size:.8rem;color:var(--muted)}

main{padding:22px 0 80px}
.lead{color:var(--muted);max-width:68ch;margin:.2em 0 1.2em}
.block{background:var(--panel);border:2px solid var(--line);border-radius:4px;box-shadow:0 3px 0 var(--bevel);padding:18px 20px;margin-bottom:20px}
.block>h3{margin-bottom:4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--lapis);color:#fff;border:0;border-radius:3px;padding:8px 14px;font-weight:600;box-shadow:0 3px 0 #0003}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0003}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);box-shadow:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pre{border:1px solid var(--line);background:var(--panel2);padding:5px 11px;border-radius:3px;font-weight:600;font-size:.9rem}
.pre:hover{border-color:var(--lapis)}
.pre.on{background:var(--lapis);border-color:var(--lapis);color:#fff}
textarea,input[type=text],input[type=search],select{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:8px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.slrow{display:grid;grid-template-columns:minmax(150px,230px) 1fr 66px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px dotted var(--line)}
.slrow:last-child{border-bottom:0}
.slrow label b{display:block;font-size:.95rem}
.slrow label span{display:block;color:var(--muted);font-size:.78rem;line-height:1.3}
.slrow output{font:700 1.05rem var(--head);text-align:right;color:var(--lapis)}
input[type=range]{width:100%;accent-color:var(--lapis);height:28px}
.insight{border-left:4px solid var(--copper);background:var(--panel2);padding:10px 14px;margin-top:14px;font-size:.92rem}
.insight p{margin:.25em 0}

/* catálogo */
.filters{display:grid;grid-template-columns:1.4fr 1fr auto;gap:10px;align-items:center;margin-bottom:10px}
.togs{display:flex;flex-wrap:wrap;gap:14px;font-size:.88rem;color:var(--muted);margin-bottom:12px}
.togs label{display:flex;gap:6px;align-items:center}
.mrow{display:grid;grid-template-columns:minmax(210px,1.6fr) 96px 110px 200px 168px;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.mrow:hover{background:var(--panel2)}
.mrow.in{box-shadow:inset 4px 0 0 var(--xp)}
.mrow.off{opacity:.55}
.mname{font-weight:700}
.mname small{font-weight:500;color:var(--muted);margin-left:6px}
.mdesc{color:var(--muted);font-size:.86rem;line-height:1.35;margin-top:2px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:.7rem;border:1px solid var(--line);padding:0 6px;border-radius:2px;color:var(--muted)}
.tag.warn{border-color:var(--gold);color:var(--gold)}
.tag.err{border-color:var(--red);color:var(--red)}
.fit{font-size:.78rem;color:var(--muted)}
.fit b{font:700 1.05rem var(--head);color:var(--text)}
.meter{height:6px;background:var(--seg);margin-top:3px}
.meter i{display:block;height:100%;background:var(--copper)}
.cost{font-size:.8rem;color:var(--muted);line-height:1.5}
.vts{display:flex;gap:3px;flex-wrap:wrap}
.vt{font-style:normal;font-size:.68rem;padding:0 5px;border:1px solid var(--line);color:var(--muted);opacity:.45;border-radius:2px}
.vt.on{opacity:1;color:var(--text);border-color:var(--copper)}
.vt.cur{background:var(--copper);color:#fff;border-color:var(--copper)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.vlink{font-size:.75rem;color:var(--lapis)}

/* pack */
.scoregrid{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
.radar{width:100%;height:auto}
.radar .ring{fill:none;stroke:var(--line);stroke-width:1}
.radar .axis{stroke:var(--line);stroke-width:1}
.radar .area{fill:var(--lapis);fill-opacity:.25;stroke:var(--lapis);stroke-width:2}
.radar text{fill:var(--muted);font:11px var(--body)}
.crit{padding:9px 0;border-bottom:1px dotted var(--line)}
.crit:last-child{border-bottom:0}
.crit .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.crit .h b{font-size:.98rem}
.crit .h span{font:700 1.1rem var(--head)}
.crit .h em{font-style:normal;color:var(--muted);font-size:.78rem;margin-left:6px}
.bar{height:8px;background:var(--seg);margin:5px 0}
.bar i{display:block;height:100%}
.notes{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:.85rem}
.notes li{margin:1px 0}
.issue{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-left:4px solid var(--line);background:var(--panel2);margin-bottom:8px;font-size:.92rem}
.issue.err{border-left-color:var(--red)}
.issue.warn{border-left-color:var(--gold)}
.issue.info{border-left-color:var(--lapis)}
.issue .t{flex:1}
.issue b{font-weight:700}
.dimrow{display:grid;grid-template-columns:200px 1fr 60px;gap:12px;align-items:center;padding:5px 0;font-size:.88rem}
.dtrack{position:relative;height:12px;background:var(--seg)}
.dtrack i{position:absolute;inset:0 auto 0 0;display:block}
.dtrack u{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--text);text-decoration:none}
.legend{font-size:.8rem;color:var(--muted);margin-top:6px}
.cgroup{margin:14px 0 4px;font-weight:700;color:var(--muted);font-size:.85rem}
.prow{display:grid;grid-template-columns:1fr 70px 80px auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line);font-size:.92rem}
.mono{font-variant-numeric:tabular-nums}

/* tabelas */
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem}
tr.best td{background:var(--panel2)}
tr.best td:first-child{box-shadow:inset 4px 0 0 var(--xp)}
.scroll{overflow-x:auto}
.sugrow{display:grid;grid-template-columns:1fr 90px auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dotted var(--line)}
.sugrow .why{color:var(--muted);font-size:.82rem}
.gain{font:700 1.1rem var(--head);color:var(--copper);text-align:right}
.gain.neg{color:var(--red)}
.ai-out{background:var(--panel2);border:1px solid var(--line);padding:14px 18px;margin-top:12px;min-height:60px}
.ai-out h4{margin:14px 0 4px;font-family:var(--head);font-size:1.1rem;color:var(--lapis)}
.ai-out ul{padding-left:20px;margin:.3em 0}
.ai-out p{margin:.4em 0}
.exp{width:100%;min-height:220px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
details{margin-top:8px}
summary{cursor:pointer;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:3px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:90vw;font-size:.9rem}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lv-y{color:var(--copper);font-weight:700}
.lv-n{color:var(--red)}
.lv-q{color:var(--muted)}
.ckrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px dotted var(--line)}
.ckrow label{display:flex;gap:12px;align-items:center;flex:1;cursor:pointer;min-height:32px}
.ckrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--xp);flex:none}
.ckrow.done .ckname{color:var(--muted);text-decoration:line-through}
.foot{color:var(--muted);font-size:.8rem;margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
.empty{padding:24px;text-align:center;color:var(--muted);border:2px dashed var(--line)}

@media (max-width:860px){
  .top .wrap{grid-template-columns:1fr;gap:8px}
  .chips{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .top .wrap{padding-top:6px;padding-bottom:6px}
  .lvl{font-size:1.6rem;min-height:1.6rem}
  .xpbar{margin:3px auto}
  .brand svg{width:30px;height:30px}
  .grid2,.scoregrid{grid-template-columns:1fr}
  .slrow{grid-template-columns:1fr 60px;row-gap:2px}
  .slrow label{grid-column:1 / -1}
  .filters{grid-template-columns:1fr}
  .mrow{grid-template-columns:1fr auto;row-gap:8px}
  .mrow .c-main{grid-column:1 / -1}
  .dimrow{grid-template-columns:1fr 50px}
  .dimrow .dtrack{grid-column:1 / -1;order:3}
  .prow{grid-template-columns:1fr auto}
  .prow .hide-m{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 8 8" aria-hidden="true" shape-rendering="crispEdges">
        <rect width="8" height="8" fill="#6e4520"/>
        <rect width="8" height="3" fill="#4f9d2d"/>

</header>

<main><div class="wrap" id="view"></div></main>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var clamp=function(x,a,b){return Math.max(a,Math.min(b,x))};
var norm=function(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()};
var fmt=function(x,d){return Number(x).toLocaleString('pt-BR',{maximumFractionDigits:d==null?1:d,minimumFractionDigits:0})};
var clone=function(o){return JSON.parse(JSON.stringify(o))};

/* ============ DADOS ============ */
var DIMS=[
 {k:'ex',n:'Exploração e aventura',d:'Estruturas, dungeons, chefes, descobrir o mundo'},
 {k:'te',n:'Tecnologia e automação',d:'Máquinas, energia, logística de itens'},
 {k:'ma',n:'Magia e mistério',d:'Sistemas mágicos, rituais, mana'},
 {k:'su',n:'Sobrevivência e desafio',d:'Sede, estações, risco, progressão dura'},
 {k:'co',n:'Construção e decoração',d:'Blocos, mobília, ferramentas de construção'},
 {k:'cb',n:'Combate e progressão RPG',d:'Armas, classes, magias de combate'},
 {k:'vi',n:'Atmosfera visual e sonora',d:'Terreno, luz, sons, animações'},
 {k:'cr',n:'Criaturas, fazenda e vida',d:'Mobs, domesticação, culinária, agricultura'},
 {k:'qo',n:'Conveniência (QoL)',d:'Mapas, receitas, inventário, informação'}
];
var DK={};DIMS.forEach(function(d){DK[d.k]=d});
var VERS=[
 {t:'A',id:'1.20.1',vq:'1.20.1',java:17,risk:1,idx:0,note:'Ecossistema de conteúdo mais vasto (Create, Cobblemon, RPG Series); mods quase só recebem correções.'},
 {t:'B',id:'1.21.1',vq:'1.21.1',java:21,risk:0,idx:1,note:'Equilíbrio: conteúdo maduro e muitos mods ainda ativos.'},
 {t:'C',id:'1.21.11',vq:'1.21.11',java:21,risk:2,idx:2,note:'Última da linha 1.x (ofuscada); recursos novos sem trocar de Java.'},
 {t:'D',id:'26.1.x',vq:'26.1.2',java:25,risk:4,idx:3,note:'Primeira versão sem ofuscação; exige Java 25 e mods recompilados (nenhum de 1.21.11 ou anterior funciona).'},
 {t:'E',id:'26.2',vq:'26.2',java:25,risk:6,idx:4,note:'Mais nova que o catálogo cobre; otimização já atualizada, conteúdo pesado ainda chegando. Pode haver versões ainda mais novas.'}
];
var VT={};VERS.forEach(function(v){VT[v.t]=v});
var CATS=['Otimização','Bibliotecas','Interface & QoL','Mapas & Navegação','Visual & Som','Mundo & Estruturas','Aventura & Combate','Tecnologia','Magia','Sobrevivência','Comida & Fazenda','Criaturas','Construção'];
var INFRA={'Otimização':1,'Bibliotecas':1};
var GR={recipes:'visualizador de receitas',minimap:'minimapa',tooltip:'informação ao mirar blocos',farview:'distância de renderização estendida'};
var PRESETS=[
 {id:'vanilla',n:'Vanilla+ polido',w:{ex:3,te:0,ma:0,su:2,co:3,cb:1,vi:6,cr:1,qo:8},vanilla:9,fps:8,size:40,d:'Quase vanilla, só mais bonito e confortável.'},
 {id:'aventura',n:'Aventura e exploração',w:{ex:9,te:0,ma:2,su:4,co:2,cb:6,vi:6,cr:3,qo:5},vanilla:5,fps:6,size:70,d:'Mundo novo, estruturas grandes, chefes.'},
 {id:'tech',n:'Tecnologia e automação',w:{ex:3,te:9,ma:1,su:4,co:6,cb:1,vi:3,cr:2,qo:6},vanilla:3,fps:6,size:55,d:'Fábricas, energia e logística.'},
 {id:'magia',n:'Magia e mistério',w:{ex:6,te:2,ma:9,su:4,co:3,cb:4,vi:5,cr:2,qo:4},vanilla:3,fps:6,size:55,d:'Progressão mágica longa.'},
 {id:'surv',n:'Sobrevivência intensa',w:{ex:5,te:1,ma:0,su:9,co:3,cb:4,vi:6,cr:4,qo:3},vanilla:6,fps:7,size:60,d:'Clima, sede, estações, mundo hostil.'},
 {id:'cria',n:'Criaturas (Cobblemon)',w:{ex:6,te:0,ma:0,su:1,co:3,cb:3,vi:5,cr:9,qo:6},vanilla:5,fps:6,size:50,d:'Capturar e treinar criaturas.'},
 {id:'build',n:'Construtor',w:{ex:2,te:3,ma:0,su:1,co:9,cb:0,vi:7,cr:2,qo:7},vanilla:6,fps:7,size:50,d:'Paleta enorme e ferramentas de obra.'}
];

var MODS=[],BY={};
function M(id,name,cat,desc,aff,ram,cpu,inv,ver,o){

function modFit(m){
  var ks=Object.keys(m.a);if(!ks.length)return null;
  var tot=0,s=0,mx=0;
  ks.forEach(function(k){tot+=m.a[k];s+=(S.w[k]/10)*m.a[k];mx=Math.max(mx,m.a[k])});
  var f=s/tot;
  f*=0.8+0.067*mx;
  f-=(S.vanilla/10)*(m.inv/3)*0.25;
  return clamp(f,0,1);
}
function critWeights(){
  var pf=0.12+0.02*S.fps;
  var sc=(1-pf)/0.80;
  return {al:0.34*sc,fo:0.14*sc,pf:pf,es:0.16*sc,sc:0.10*sc,fu:0.06*sc};
}
function score(ids,t,lite){
  var set={},mods=[];
  ids.forEach(function(i){var m=BY[i];if(m&&!set[i]){set[i]=1;mods.push(m)}});

  var orph=mods.filter(function(m){return m.lib&&m.id!=='fabric-api'&&!used[m.id]});

  DIMS.forEach(function(d){r.Pd[d.k]=0});
  if(!n){if(!lite)r.notes.al.push('Pack vazio.');return r}
  mods.forEach(function(m){if(orph.indexOf(m)>=0)return;for(var k in m.a)r.Pd[k]+=m.a[k]});
  var W=S.w,wsum=0;DIMS.forEach(function(d){wsum+=W[d.k]});wsum=wsum||1;
  var SAT=clamp(S.size/9,4,20);r.SAT=SAT;
  /* Alinhamento */
  var cov=0,dot=0,np=0,nw=0;
  DIMS.forEach(function(d){var k=d.k,T=(W[k]/10)*SAT;cov+=W[k]*(T>0?Math.min(1,r.Pd[k]/T):1);dot+=r.Pd[k]*W[k];np+=r.Pd[k]*r.Pd[k];nw+=W[k]*W[k]});
  cov/=wsum;var cs=(np&&nw)?dot/(Math.sqrt(np)*Math.sqrt(nw)):0;
  var content=mods.filter(function(m){return !INFRA[m.cat]&&!m.lib});
  var invAvg=content.length?content.reduce(function(s,m){return s+m.inv},0)/content.length:0;
  var tgt=0.4+(1-S.vanilla/10)*1.6;
  var van=1-Math.min(1,Math.abs(invAvg-tgt)/1.3);
  r.crit.al=100*(0.45*cov+0.30*cs+0.25*van);
  r.cov=cov;r.invAvg=invAvg;r.invTgt=tgt;
  if(!lite)r.notes.al.push('Cobertura do que você pediu: '+Math.round(cov*100)+'%.');
  var lacks=DIMS.filter(function(d){return W[d.k]>=6&&r.Pd[d.k]<(W[d.k]/10)*SAT*0.5}).map(function(d){return d.n});
  if(!lite&&lacks.length)r.notes.al.push('Pouco conteúdo em: '+lacks.join(', ')+'.');
  var diff=invAvg-tgt;
  if(!lite&&content.length&&Math.abs(diff)>0.6)r.notes.al.push(diff>0?'O pack altera o vanilla mais do que você quer (mods de conteúdo muito invasivos).':'O pack é mais “vanilla” do que você pediu; há espaço para mods mais transformadores.');
  /* Foco */
  var S2=DIMS.filter(function(d){return W[d.k]>=5}).map(function(d){return d.k});
  if(!S2.length){S2=DIMS.slice().sort(function(a,b){return W[b.k]-W[a.k]}).slice(0,2).map(function(d){return d.k})}
  var mt=0,mi=0;DIMS.forEach(function(d){mt+=r.Pd[d.k];if(S2.indexOf(d.k)>=0)mi+=r.Pd[d.k]});
  var ratio=mt?mi/mt:0,s1=clamp((ratio-0.4)/0.4,0,1);
  var offs=content.filter(function(m){var f=modFit(m);return f!==null&&f<0.2});
  var offR=content.length?offs.length/content.length:0,s2=1-clamp(offR*1.6,0,1);
  var disp=DIMS.filter(function(d){return r.Pd[d.k]>=6&&W[d.k]<=3});
  var s3=1-clamp(disp.length*0.25,0,1);
  r.crit.fo=100*(0.45*s1+0.35*s2+0.20*s3);
  r.focusRatio=ratio;
  if(!lite)r.notes.fo.push(Math.round(ratio*100)+'% do conteúdo cai nas áreas que você priorizou (meta: acima de 75%).');
  if(!lite&&offs.length)r.notes.fo.push(offs.length+' mod(s) fora do objetivo: '+offs.slice(0,4).map(function(m){return m.name}).join(', ')+(offs.length>4?'…':'')+'.');
  if(!lite&&disp.length)r.notes.fo.push('Dispersão: conteúdo relevante em áreas que você não quer (' +disp.map(function(d){return d.n}).join(', ')+').');
  r.offs=offs;
  /* Desempenho */
  var ram=1300,load=0;mods.forEach(function(m){ram+=m.ram;load+=m.cpu});
  r.ram=ram;r.load=load;r.ratio=ram/H;
  var rs=clamp((1-r.ratio)/0.45,0,1),cs2=clamp((40-load)/32,0,1);
  r.crit.pf=100*(0.6*rs+0.4*cs2);
  if(!lite)r.notes.pf.push('RAM estimada: ~'+fmt(ram,0)+' MB de '+fmt(H,0)+' MB ('+Math.round(r.ratio*100)+'%). Confortável até ~55%; acima de 85% há risco de travadas e crash.');
  if(!lite)r.notes.pf.push('Carga de CPU estimada: '+fmt(load,1)+' pts (menor é melhor; acima de ~25 pesa).');
  var gp=mods.filter(function(m){return m.gpu});
  if(!lite&&gp.length)r.notes.pf.push('Shaders pesam principalmente na GPU: confirme o FPS com a sua placa.');
  var hv=mods.filter(function(m){return m.heavy});
  if(!lite&&hv.length&&H<=4096)r.notes.pf.push('Mods pesados com pouca RAM: '+hv.map(function(m){return m.name}).join(', ')+'.');
  /* Estabilidade */
  var est=100,missing={},unavail=[],conf=[],groups={},frag=[];
  mods.forEach(function(m){
    m.dep.forEach(function(d){if(!set[d]){(missing[d]=missing[d]||[]).push(m)}});
    if(m.ver.indexOf(t)<0)unavail.push(m);
    m.con.forEach(function(c){if(set[c]&&m.id<c)conf.push([m,BY[c]])});
    if(m.grp)(groups[m.grp]=groups[m.grp]||[]).push(m);
    if(m.fragile)frag.push(m);
  });
  var md=Object.keys(missing);
  est-=30*conf.length;est-=12*md.length;est-=10*unavail.length;
  var gk=Object.keys(groups).filter(function(g){return groups[g].length>1});
  gk.forEach(function(g){est-=10*(groups[g].length-1)});
  est-=Math.min(12,3*frag.length);est-=4*orph.length;
  r.crit.es=clamp(est,0,100);
  if(!lite)conf.forEach(function(c){r.issues.push({sev:'err',text:'<b>'+esc(c[0].name)+'</b> conflita com <b>'+esc(c[1].name)+'</b> (os dois reescrevem a mesma parte do jogo).',fix:{act:'rm',id:c[1].id,label:'Remover '+c[1].name}})});
  if(!lite)md.forEach(function(d){var dm=BY[d];r.issues.push({sev:'err',text:'<b>'+esc(missing[d].map(function(m){return m.name}).slice(0,3).join(', '))+(missing[d].length>3?'…':'')+'</b> precisa(m) de <b>'+esc(dm?dm.name:d)+'</b>.',fix:{act:'add',id:d,label:'Adicionar'}})});
  if(!lite)unavail.forEach(function(m){r.issues.push({sev:'warn',text:'<b>'+esc(m.name)+'</b> não tem build conhecida para '+V.id+'.',fix:{act:'rm',id:m.id,label:'Remover'}})});
  if(!lite)gk.forEach(function(g){r.issues.push({sev:'warn',text:'Redundância ('+GR[g]+'): '+groups[g].map(function(m){return '<b>'+esc(m.name)+'</b>'}).join(' + ')+'. Mantenha só um.'})});
  if(!lite)frag.forEach(function(m){r.issues.push({sev:'info',text:'<b>'+esc(m.name)+'</b>: '+esc(m.note||'experimental')})});
  /* libs órfãs */
  if(!lite)orph.forEach(function(m){r.issues.push({sev:'info',text:'<b>'+esc(m.name)+'</b> não é usada por nenhum mod do pack.',fix:{act:'rm',id:m.id,label:'Remover'}})});
  if(!lite){if(r.ratio>1)r.issues.unshift({sev:'err',text:'RAM estimada acima do heap: o jogo deve travar ou falhar ao carregar.'});}
  else if(r.ratio>0.85)r.issues.unshift({sev:'warn',text:'RAM estimada acima de 85% do heap: sem folga para exploração e chunks.'});
  if(!lite)r.notes.es.push(conf.length+' conflito(s) direto(s), '+md.length+' dependência(s) faltando, '+gk.length+' redundância(s), '+unavail.length+' mod(s) sem build conhecida em '+V.id+'.');
  r.conf=conf.length;r.miss=md.length;r.unav=unavail.length;
  /* Escopo */
  var N=S.size,ne=Math.max(1,n-orph.length),sz=1-clamp(Math.abs(Math.log(ne/N))/Math.log(4),0,1);
  var oh=content.filter(function(m){return m.inv>=3}).length,allowed=(S.vanilla<=4?3:2)+(N>100?1:0);
  var s4=1-clamp(0.15*Math.max(0,oh-allowed),0,0.6);
  r.crit.sc=100*(0.65*sz+0.35*s4);
  if(!lite)r.notes.sc.push(n+' mods no pack (meta: '+N+'). '+(n<N*0.7?'Ainda abaixo da meta.':n>N*1.4?'Acima da meta: considere cortar.':'Dentro da faixa.'));
  if(!lite)r.notes.sc.push(oh+' mod(s) de conteúdo muito transformador(es) (tolerância para o seu perfil: '+allowed+'). Muitos overhauls juntos disputam o mesmo espaço de jogo.');
  r.oh=oh;
  /* Fundamentos */
  var cw=0,cp=0,cmiss=[];
  MODS.forEach(function(m){if(m.core&&m.ver.indexOf(t)>=0){var w=(H<=4096&&(m.id==='ferritecore'||m.id==='modernfix'))?2:1;cw+=w;if(set[m.id])cp+=w;else cmiss.push(m.name)}});
  r.crit.fu=cw?100*cp/cw:100;
  if(!lite)r.notes.fu.push(cmiss.length?'Faltam fundamentos recomendados: '+cmiss.join(', ')+'.':'Todos os fundamentos recomendados para '+V.id+' estão presentes.');
  /* Total */
  var w=critWeights(),tot=0;for(var k in w)tot+=w[k]*r.crit[k];
  tot*=0.5+0.5*(r.crit.al/100);
  if(conf.length)tot=Math.min(tot,70);
  if(md.length)tot=Math.min(tot,78);
  tot-=Math.min(12,2*unavail.length);
  r.total=clamp(tot,0,100);
  r.issues.sort(function(a,b){var o={err:0,warn:1,info:2};return o[a.sev]-o[b.sev]});
  return r;
}
function adjTxt(x){x=Math.round(x*10)/10+0;if(x===0)return '0';return (x>0?'+':'')+fmt(x,1)}
function vAdj(v){return -v.risk+(S.nov-5)*(v.idx-2)*0.8}
function evalPack(ids){
  if(S.ver!=='auto'){var x=score(ids,S.ver);x.auto=false;return x}
  if(!ids.length){var e=score(ids,'B');e.auto=true;return e}
  var best=null;
  VERS.forEach(function(v){var r=score(ids,v.t);r.rank=r.total+vAdj(v);if(!best||r.rank>best.rank)best=r});
  best.auto=true;return best;
}
function recompute(){cur=evalPack(S.pack)}
function tierLabel(x){
  if(x>=85)return 'Excelente: alinhado e saudável';
  if(x>=72)return 'Muito bom, poucos ajustes';
  if(x>=58)return 'Bom, mas pede ajustes';
  if(x>=42)return 'Arriscado: falta foco ou sobra peso';
  return 'Fraco para o objetivo atual';
}
function withDeps(id,t,ids){
  var add=[],seen={};ids.forEach(function(i){seen[i]=1});var ok=true;
  (function go(i){if(seen[i])return;var m=BY[i];if(!m||m.ver.indexOf(t)<0){ok=false;return}seen[i]=1;m.dep.forEach(go);add.push(i)})(id);
  return ok?add:null;
}
function bestAdds(ids,t,limit){
  var base=score(ids,t,true),out=[];
  MODS.forEach(function(m){
    if(ids.indexOf(m.id)>=0||m.ver.indexOf(t)<0||S.ban.indexOf(m.id)>=0)return;
    var add=withDeps(m.id,t,ids);if(!add)return;
    var r=score(ids.concat(add),t,true);out.push({m:m,add:add,gain:r.total-base.total,r:r});
  });
  out.sort(function(a,b){return b.gain-a.gain});
  return {base:base,list:out.slice(0,limit)};
}
function autoBuild(t,start){
  var ids=start.slice(),g=0;
  while(g++<220){
    var b=bestAdds(ids,t,1);
    if(!b.list.length||b.list[0].gain<0.08||ids.length>=S.size*1.15)break;
    ids=ids.concat(b.list[0].add);
  }
  return ids;
}
function removeCandidates(ids,t){
  var base=score(ids,t,true),out=[];
  ids.forEach(function(id){
    var needed=ids.some(function(o){return o!==id&&BY[o]&&BY[o].dep.indexOf(id)>=0});
    if(needed)return;
    var r=score(ids.filter(function(x){return x!==id}),t,true);
    out.push({m:BY[id],gain:r.total-base.total,r:r});
  });
  out.sort(function(a,b){return b.gain-a.gain});return out;
}
function deltaText(a,b){
  var names={al:'Alinhamento',fo:'Foco',pf:'Desempenho',es:'Estabilidade',sc:'Escopo',fu:'Fundamentos'},w=critWeights(),d=[];
  for(var k in names){var x=(b.crit[k]-a.crit[k]);if(Math.abs(x)>=1)d.push([k,x,Math.abs(x*w[k])])}
  d.sort(function(p,q){return q[2]-p[2]});
  return d.slice(0,3).map(function(x){return (x[1]>0?'+':'')+Math.round(x[1])+' '+names[x[0]]}).join(' · ');
}
function recT(){return S.ver!=='auto'?S.ver:(ui.vres?ui.vres.best:(cur&&cur.n?cur.t:'B'))}
function vkey(){return JSON.stringify([S.w,S.vanilla,S.fps,S.nov,S.size,S.heap,S.ban,S.useLive])}
function computeVersions(){
  var rows=VERS.map(function(v){
    var ids=autoBuild(v.t,[]),r=score(ids,v.t);
    var have=S.pack.filter(function(i){return BY[i].ver.indexOf(v.t)>=0}).length;
    return {v:v,ids:ids,r:r,rank:r.total+vAdj(v),have:have};
  });
  var best=rows.slice().sort(function(a,b){return b.rank-a.rank})[0];
  return {rows:rows,best:best.v.t};
}

function addMod(id){
  if(S.pack.indexOf(id)>=0)return;
  var t=recT(),add=[],seen={};S.pack.forEach(function(i){seen[i]=1});
  (function go(i){if(seen[i]||!BY[i])return;seen[i]=1;BY[i].dep.forEach(go);add.push(i)})(id);
  S.ban=S.ban.filter(function(b){return add.indexOf(b)<0});
  S.pack=S.pack.concat(add);
  if(add.length>1)toast('Adicionado '+BY[id].name+' + '+(add.length-1)+' dependência(s).');
}

function radar(c){
  var keys=['al','fo','pf','es','sc','fu'],lab=['Alinhamento','Foco','Desempenho','Estabilidade','Escopo','Fundamentos'];
  var cx=140,cy=120,R=78;
  function pt(i,v){var a=-Math.PI/2+i*2*Math.PI/6;return [cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v]}
  var s='<svg class="radar" viewBox="-50 0 380 240" role="img" aria-label="Radar dos seis critérios">';
  [0.25,0.5,0.75,1].forEach(function(f){s+='<polygon class="ring" points="'+keys.map(function(k,i){return pt(i,f).join(',')}).join(' ')+'"/>'});
  keys.forEach(function(k,i){var p=pt(i,1);s+='<line class="axis" x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'"/>'});
  s+='<polygon class="area" points="'+keys.map(function(k,i){return pt(i,c.crit[k]/100).join(',')}).join(' ')+'"/>';
  keys.forEach(function(k,i){
    var a=-Math.PI/2+i*2*Math.PI/6,x=cx+Math.cos(a)*(R+14),y=cy+Math.sin(a)*(R+14)+4,an=Math.cos(a)>0.3?'start':Math.cos(a)<-0.3?'end':'middle';
    s+='<text x="'+x+'" y="'+y+'" text-anchor="'+an+'">'+lab[i]+' '+Math.round(c.crit[k])+'</text>';
  });
  return s+'</svg>';
}

function parseList(text){

  lines.forEach(function(raw){
    var l=raw.trim();if(!l)return;
    var b=l.match(/^(?:[-*•–]|\d+[.)])\s+(.+)$/);
    if(b){

    var vm=l.match(/Fidelidade ao vanilla:\s*(\d+).*?Prioridade de desempenho:\s*(\d+).*?Vontade de versão nova:\s*(\d+).*?Tamanho-alvo:\s*(\d+)/i);
    if(vm){opts.vanilla=clamp(+vm[1],0,10);opts.fps=clamp(+vm[2],0,10);opts.nov=clamp(+vm[3],0,10);opts.size=clamp(+vm[4],15,200);hasOpts=true;return}
    var om=l.match(/^(.+?):\s*(\d+)\s*$/);
    if(om){var dim=DIMS.filter(function(d){return norm(d.n)===norm(om[1].trim())})[0];if(dim){(opts.w=opts.w||{})[dim.k]=clamp(+om[2],0,10);hasOpts=true;return}}

    return {err:'Nada reconhecido. Use o nome da categoria numa linha e cada mod com “- ” na frente, ou linhas de opções como “Tecnologia e automação: 7”.'};
  }
  if(declared!==null&&declared!==listed)warns.push('O arquivo declara '+declared+' mods, mas a lista tem '+listed+' item(ns).');

}

var API='https://api.modrinth.com/v2',LKEY='forja-live-v1';
var GVMAP={A:['1.20.1'],B:['1.21.1'],C:['1.21.11'],D:['26.1','26.1.1','26.1.2'],E:['26.2']};
var QOVR={create:'Create Fabric',createrails:'Create: Steam ’n’ Rails',rei:'Roughly Enough Items',jei:'Just Enough Items',spark:'spark',wizards:'Wizards (RPG Series)',paladins:'Paladins & Priests (RPG Series)',archers:'Archers (RPG Series)',ctov:'ChoiceTheorem’s Overhauled Village',iris:'Iris Shaders'};
var NOLIVE={shaders:1};
var NET=!window.claude;
var LIVE=(function(){try{var r=localStorage.getItem(LKEY);var o=r?JSON.parse(r):null;return(o&&o.mods)?o:{ts:0,mods:{}}}catch(e){return {ts:0,mods:{}}}})();
function liveSave(){try{localStorage.setItem(LKEY,JSON.stringify(LIVE))}catch(e){}}
function applyLive(){
  MODS.forEach(function(m){
    if(m.ver0===undefined)m.ver0=m.ver;
    var L=LIVE.mods[m.id];
    if(S.useLive&&L&&L.found&&L.tiers){var v='';VERS.forEach(function(x){if(L.tiers[x.t])v+=x.t});m.ver=v;m.live=true}
    else{m.ver=m.ver0;m.live=false}
  });

function getJSON(url,signal){
  return fetch(url,{signal:signal}).then(function(r){if(!r.ok){var e=new Error('http');e.status=r.status;throw e}return r.json()});
}
async function findProject(m,signal){
  var q=QOVR[m.id]||m.name,nq=normName(q),best=null;
  var facets=encodeURIComponent('[["project_type:mod"],["categories:fabric"]]');
  var j=await getJSON(API+'/search?query='+encodeURIComponent(q)+'&facets='+facets+'&limit=8',signal);
  (j.hits||[]).forEach(function(h){
    var nt=normName(h.title),sc=nt===nq?3:(nt.indexOf(nq)===0?2:(nt.indexOf(nq)>=0||(nt.length>=8&&nq.indexOf(nt)>=0)?1:0));
    if(sc&&(!best||sc>best.sc||(sc===best.sc&&h.downloads>best.h.downloads)))best={sc:sc,h:h};
  });
  return best?best.h:null;
}
async function liveOne(m,signal){
  var h=await findProject(m,signal);
  if(!h)return {found:false};
  var gv=[];VERS.forEach(function(v){gv=gv.concat(GVMAP[v.t])});
  var url=API+'/project/'+encodeURIComponent(h.project_id)+'/version?loaders='+encodeURIComponent('["fabric"]')+'&game_versions='+encodeURIComponent(JSON.stringify(gv))+'&include_changelog=false';
  var vs=await getJSON(url,signal),tiers={};
  VERS.forEach(function(v){
    var c=vs.filter(function(x){return (x.game_versions||[]).some(function(g){return GVMAP[v.t].indexOf(g)>=0})});
    if(!c.length){tiers[v.t]=null;return}
    c.sort(function(a,b){return String(b.date_published).localeCompare(String(a.date_published))});
    var rel=c.filter(function(x){return x.version_type==='release'}),pk=rel[0]||c[0];
    tiers[v.t]={v:pk.version_number,d:String(pk.date_published).slice(0,10),t:pk.version_type};
  });
  return {found:true,pid:h.project_id,slug:h.slug,title:h.title,tiers:tiers,ts:Date.now()};
}
async function runLive(ids){
  if(ui.live.running)return;
  var ctl=new AbortController();
  ui.live={running:true,done:0,total:ids.length,err:'',ctl:ctl,cur:''};
  renderLive();
  var q=ids.slice(),fail=false;
  async function worker(){
    while(q.length&&!fail&&!ctl.signal.aborted){
      var id=q.shift(),m=BY[id];
      if(NOLIVE[id]){ui.live.done++;continue}
      try{LIVE.mods[id]=await liveOne(m,ctl.signal)}
      catch(e){
        if(e&&e.name==='AbortError')return;
        if(e&&e.status===429){fail=true;ui.live.err='O Modrinth limitou as requisições. Aguarde cerca de 1 minuto e tente de novo.';return}
        if(e&&e.status){LIVE.mods[id]={found:false,error:e.status}}
        else{fail=true;ui.live.err='Não foi possível acessar a API do Modrinth a partir deste ambiente (rede bloqueada ou política de segurança do navegador). Abra a versão hospedada (por exemplo, no GitHub Pages) e tente de novo.';return}
      }
      ui.live.done++;ui.live.cur=m.name;renderLiveProg();
    }
  }
  var ws=[];for(var i=0;i<4;i++)ws.push(worker());
  await Promise.all(ws);
  LIVE.ts=Date.now();liveSave();applyLive();
  ui.live.running=false;ui.live.ctl=null;ui.vkey='';
  recompute();renderTop();renderTabs();
  if(ui.tab==='suggest')renderView();else if(ui.tab==='catalog')renderGrid();
}

  var f=0,nf=0;for(var k in LIVE.mods){if(LIVE.mods[k].found)f++;else nf++}

}

  return h+'</tbody></table></div><p class="sub" style="margin-top:8px">Passe o mouse sobre o ✓ para ver a build mais recente e a data. Dados do Modrinth (loader Fabric); builds em beta ou alpha também contam.</p>';
}
function liveHTML(){
  var lv=ui.live,n=S.pack.length;
  var h='<p class="sub">Consulta o Modrinth (loader Fabric) e mostra, mod por mod, em quais versões existe build de verdade. O resultado corrige o catálogo e passa a valer nas notas e nas recomendações.</p>';
  if(!NET)h+='<div class="issue info"><div class="t">Esta verificação só funciona fora do claude.ai, por exemplo na versão hospedada no GitHub Pages. Aqui o navegador bloqueia chamadas de rede.</div></div>';
  else{
    h+='<div class="row"><button class="btn" data-act="livepack"'+((lv.running||!n)?' disabled':'')+'>Verificar os '+n+' mods do pack</button><button class="btn ghost" data-act="livecat"'+(lv.running?' disabled':'')+'>Verificar o catálogo inteiro ('+MODS.length+')</button>'+(lv.running?'<button class="btn danger" data-act="livestop">Parar</button>':'')+'</div>';
  }
  h+='<p class="sub" id="liveProg" style="margin-top:8px">'+liveProgText()+'</p>';
  h+='<label style="display:flex;gap:8px;align-items:center;font-size:.9rem;margin:6px 0"><input type="checkbox" id="uselive"'+(S.useLive?' checked':'')+'> Usar os dados ao vivo nas notas e recomendações</label>';
  return h+liveResults();
}
function renderLive(){var el=$('#liveBox');if(el)el.innerHTML=liveHTML()}

/* ============ EVENTOS ============ */
function arm(el,fn,label){
  if(!label||!el){fn();return}
  if(el.dataset.armed){delete el.dataset.armed;fn();return}
  el.dataset.armed='1';var t=el.textContent;el.textContent=label+' Clique de novo.';
  setTimeout(function(){if(el&&el.dataset){delete el.dataset.armed;el.textContent=t}},3500);
}
function act(a,d,el){
  switch(a){
    case 'tab':ui.tab=d.id;ui.exportText='';renderTabs();renderView();window.scrollTo({top:0,behavior:'auto'});break;
    case 'theme':{var cs=document.documentElement.getAttribute('data-theme');var dark=cs?cs==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',dark?'light':'dark');break}
    case 'preset':applyPreset(d.id);break;
    case 'add':addMod(d.id);commit();break;
    case 'rm':rmMod(d.id);commit();break;
    case 'ban':{var i=S.ban.indexOf(d.id);if(i>=0)S.ban.splice(i,1);else S.ban.push(d.id);commit();break}
    case 'clear':arm(el,function(){S.pack=[];ui.exportText='';commit()},'Limpar tudo?');break;
    case 'copylist':copyText(packList(),'Lista copiada.');break;
    case 'copybrief':copyText(brief(),'Briefing copiado. Cole numa conversa com busca na web.');break;
    case 'dljson':dl(slug()+'.json',JSON.stringify(exportObj(),null,2),'application/json');break;
    case 'dltxt':dl(slug()+'.txt',txtExport(),'text/plain');break;
    case 'copyjson':copyText(JSON.stringify(exportObj(),null,2),'JSON copiado.');break;
    case 'impapply':{
      var r=ui.imp.res;if(!r||!r.ok)break;
      var o=r.ok,mode=d.mode||'replace';
      if(mode==='opts'){
        if(!o.opts)break;
        applyOpts(o.opts);ui.imp={text:'',res:null};ui.vkey='';ui.tab='goal';
        $('#packName').value=S.name;persist();recompute();renderTop();renderTabs();renderView();
        window.scrollTo({top:0,behavior:'auto'});
        toast('Opções do Objetivo importadas. O pack atual foi mantido.');
        break}
      arm(el,function(){
        var inc=$('#impdeps'),ids=o.pack.slice();
        if(inc&&inc.checked)ids=withAllDeps(ids);
        if(mode==='add'){S.pack=S.pack.concat(ids.filter(function(i){return S.pack.indexOf(i)<0}))}
        else{if(o.opts)applyOpts(o.opts);S.pack=ids;if(o.ban)S.ban=o.ban;if(r.kind==='json')S.done=o.done||[]}
        S.ban=S.ban.filter(function(i){return S.pack.indexOf(i)<0});
        ui.imp={text:'',res:null};ui.exportText='';ui.vkey='';ui.tab='pack';
        $('#packName').value=S.name;persist();recompute();renderTop();renderTabs();renderView();
        window.scrollTo({top:0,behavior:'auto'});
        toast((mode==='add'?'Somados ao pack: ':'Pack importado: ')+ids.length+' mods. Total: '+S.pack.length+'.');
      },(mode==='replace'&&S.pack.length)?'Substituir pack atual?':null);
      break}
    case 'livepack':runLive(S.pack.slice());break;
    case 'livecat':runLive(MODS.map(function(m){return m.id}));break;
    case 'livestop':if(ui.live.ctl)ui.live.ctl.abort();break;
    case 'ckcat':{
      var on=d.on==='1',cids=S.pack.filter(function(i){return BY[i].cat===d.cat});
      cids.forEach(function(i){var k=S.done.indexOf(i);if(on&&k<0)S.done.push(i);else if(!on&&k>=0)S.done.splice(k,1)});
      persist();renderTabs();var y1=window.scrollY||0;renderView();window.scrollTo(0,y1);break}
    case 'ckclear':arm(el,function(){S.done=[];persist();renderTabs();renderView()},'Zerar tudo?');break;
    case 'usever':S.ver=d.id;persist();recompute();renderTop();renderView();break;
    case 'auto':{
      var t=recT(),start=d.mode==='complete'?S.pack:[];
      var run=function(){var ids=autoBuild(t,start);S.pack=ids;commit();
        toast('Pack montado com '+ids.length+' mods ('+VT[t].id+').');
        if(ui.tab!=='pack'){ui.tab='pack';renderTabs();renderView()}
        window.scrollTo({top:0,behavior:'auto'})};
      if(d.mode==='replace'&&S.pack.length)arm(el,run,'Substituir o pack atual?');else run();
      break}
  }
}
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset,b)});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='packName'){S.name=el.value;persist();return}
  if(el.id==='q'){ui.q=el.value;renderGrid();return}
  if(el.id==='impText'){impParse(el.value);return}
  if(el.type==='range'&&el.dataset.k){
    var k=el.dataset.k,v=+el.value;
    if(DK[k])S.w[k]=v;else S[k]=v;
    S.preset='';
    var o=$('#o_'+k);if(o)o.textContent=v+(k==='size'?' mods':'');
    var pr=document.querySelectorAll('.pre.on');for(var i=0;i<pr.length;i++)pr[i].classList.remove('on');
    persist();recompute();renderTop();renderInsight();
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='impFile'){var f=el.files&&el.files[0];if(f){var fr=new FileReader();fr.onload=function(){var ta=$('#impText');if(ta)ta.value=fr.result;impParse(String(fr.result))};fr.onerror=function(){toast('Não foi possível ler o arquivo.')};fr.readAsText(f)}return}
  if(el.dataset&&el.dataset.ck){
    var cid=el.dataset.ck,ci=S.done.indexOf(cid);
    if(el.checked&&ci<0)S.done.push(cid);else if(!el.checked&&ci>=0)S.done.splice(ci,1);
    persist();renderTabs();var y2=window.scrollY||0;renderView();window.scrollTo(0,y2);return}
  if(el.id==='ckpend'){ui.ckPend=el.checked;var y3=window.scrollY||0;renderView();window.scrollTo(0,y3);return}
  if(el.id==='uselive'){S.useLive=el.checked;persist();applyLive();ui.vkey='';recompute();renderTop();renderTabs();if(ui.tab==='suggest')renderView();return}
  if(el.id==='fcat'){ui.cat=el.value;renderGrid();return}
  if(el.id==='fsort'){ui.sort=el.value;renderGrid();return}
  if(el.id==='fav'){ui.onlyAvail=el.checked;renderGrid();return}
  if(el.id==='fban'){ui.hideBan=el.checked;renderGrid();return}
  if(el.dataset&&el.dataset.k==='heap'){S.heap=+el.value;persist();recompute();renderTop();renderInsight();return}
  if(el.dataset&&el.dataset.k==='ver'){S.ver=el.value;persist();recompute();renderTop();return}
});

/* ============ INICIAR ============ */
$('#packName').value=S.name||'Meu modpack';
applyLive();recompute();renderTop();renderTabs();renderView();
(function(){try{if(window.claude&&typeof window.claude.use==='function'){window.claude.use('downloads').then(function(d){DL=d}).catch(function(){})}}catch(e){}})();
})();
</script>
</body>
</html>
